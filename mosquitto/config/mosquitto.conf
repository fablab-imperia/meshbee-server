persistence true
persistence_location /mosquitto/data/

# Solo stdout: i log finiscono al driver di logging di Docker, che li ruota.
# Scrivere anche su file (log_dest file) creava un secondo log identico sull'host
# che cresceva senza limite — su SD card di un Raspberry Pi è un problema.
#   docker-compose logs -f mosquitto
log_dest stdout

# Listener per connessioni MQTT
listener 1883
protocol mqtt

# Listener per WebSocket (opzionale, utile per web apps)
listener 9001
protocol websockets

# Configurazione di sicurezza
# Il broker richiede autenticazione con username e password, e non parte se il
# file delle password non esiste: è la causa più frequente di "non si avvia".
# Generalo con:  make mqtt-passwd      (usa MQTT_USER/MQTT_PASSWORD da .env)
# Va rigenerato ogni volta che MQTT_PASSWORD cambia.
allow_anonymous false
password_file /mosquitto/config/passwd

# Per disabilitare l'autenticazione (solo sviluppo locale senza Docker):
# allow_anonymous true

# ACL (Access Control List) - opzionale
# acl_file /mosquitto/config/acl

# Nessun limite sulla dimensione dei pacchetti: è già il default, quindi non
# serve alcuna direttiva.
# C'era `message_size_limit 0`, deprecato da mosquitto 2.0 (warning a ogni
# avvio). Attenzione: il sostituto `max_packet_size` **non accetta 0** — il
# broker rifiuta di partire. Per imporre un limite reale, aggiungere qui
# `max_packet_size <bytes>` con un valore > 0; le letture dei nodi sono JSON di
# poche centinaia di byte.

# QoS
max_qos 2

# Mantenimento connessioni
max_keepalive 65535

# Log level: error, warning, notice, information, debug, subscribe, unsubscribe
log_type error
log_type warning
log_type notice
log_type information

# Timestamp nei log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

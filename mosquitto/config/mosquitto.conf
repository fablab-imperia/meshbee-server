# Mosquitto broker configuration — see mosquitto/README.md

persistence true
persistence_location /mosquitto/data/

# stdout only: logs go to Docker's logging driver, which rotates them.
# Also writing to a file (log_dest file) produced a second, identical log on the
# host that grew without bound — a problem on a Raspberry Pi's SD card.
#   docker-compose logs -f mosquitto
log_dest stdout

# Listener for MQTT connections — the nodes and the handler use this one.
listener 1883
protocol mqtt

# Listener for WebSockets (optional, useful for web apps). Nothing uses it today.
listener 9001
protocol websockets

# Security.
# The broker requires a username and password, and refuses to start when the
# password file is missing: that is the most common cause of "it won't start".
# Generate it with:  make mqtt-passwd     (uses MQTT_USER/MQTT_PASSWORD from .env)
# Regenerate it whenever MQTT_PASSWORD changes.
allow_anonymous false
password_file /mosquitto/config/passwd

# To disable authentication (local development without Docker only):
# allow_anonymous true

# ACL (Access Control List) — optional. Every account can currently publish and
# subscribe to any topic; an acl_file would restrict a node to its own topic.
# acl_file /mosquitto/config/acl

# No packet size limit: that is already the default, so no directive is needed.
# This used to be `message_size_limit 0`, deprecated since mosquitto 2.0 (it
# warns on every start). Careful: the replacement `max_packet_size` does **not**
# accept 0 — the broker refuses to start. To enforce a real limit, add
# `max_packet_size <bytes>` with a value > 0; node readings are JSON of a few
# hundred bytes.

# QoS
max_qos 2

# Keepalive
max_keepalive 65535

# Log level: error, warning, notice, information, debug, subscribe, unsubscribe
log_type error
log_type warning
log_type notice
log_type information

# Timestamps in the log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

[pytest]
testpaths = tests
# Put the rootdir (/app in the container) on sys.path so `api`, `mqtt_handler`
# and `tests` import as packages. `meshbee_core` also resolves via its editable
# install, so it imports here exactly as it does in the two service images.
pythonpath = .
addopts = -ra --strict-markers
markers =
    integration: needs the postgres-test database (docker-compose --profile test up -d postgres-test).
        Skip with: pytest -m "not integration"

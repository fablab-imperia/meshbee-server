services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: meshbee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beehive_iot
      POSTGRES_USER: beehive_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # No init script: the schema comes from the `migrate` service below.
    ports:
      - "5432:5432"
    networks:
      - beehive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beehive_user -d beehive_iot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database usato solo dai test di integrazione.
  # Dati in tmpfs (nessun volume da pulire) e profilo "test": non parte con un
  # normale `docker-compose up`. Lo schema viene ricostruito dalle migrazioni
  # (alembic upgrade head) a ogni esecuzione della suite, quindi il DB è sempre pulito.
  #   docker-compose --profile test up -d postgres-test
  postgres-test:
    image: postgres:18-alpine
    container_name: meshbee-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_DB: beehive_test
      POSTGRES_USER: beehive_user
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - beehive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beehive_user -d beehive_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mosquitto MQTT Broker (con autenticazione)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: meshbee-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      # Persistenza: messaggi retained e code QoS 1/2 sopravvivono al restart.
      - ./mosquitto/data:/mosquitto/data
      # Nessun mount per i log: il broker scrive solo su stdout (vedi mosquitto.conf).
    networks:
      - beehive-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t '$$SYS/test' -m '' -u ${MQTT_USER:-beehive} -P ${MQTT_PASSWORD} 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Migrate: brings the schema to the latest Alembic revision, then exits.
  # Every service that touches the database waits for it to exit 0, so none of
  # them ever sees a half-built schema. Re-running it at head is a no-op.
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: meshbee-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: beehive_iot
      DB_USER: beehive_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - beehive-network
    volumes:
      - ./scripts:/app/scripts
      - ./meshbee_core:/app/meshbee_core
      - ./alembic.ini:/app/alembic.ini:ro
    command: python -m scripts.migrate

  # Seed: crea utenti con hash bcrypt reali (gira una sola volta)
  seed:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: meshbee-seed
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: beehive_iot
      DB_USER: beehive_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      USER_PASSWORD: ${USER_PASSWORD}
      # No JWT_SECRET_KEY: the seed reads SeedSettings, which extends
      # CoreSettings (database only) and knows nothing about tokens.
    networks:
      - beehive-network
    volumes:
      - ./scripts:/app/scripts
      - ./meshbee_core:/app/meshbee_core
    command: python -m scripts.seed

  # MQTT Data Handler
  mqtt-handler:
    build:
      context: .
      dockerfile: mqtt_handler/Dockerfile
    container_name: meshbee-mqtt-handler
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: beehive/+/data
      MQTT_USER: ${MQTT_USER:-beehive}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: beehive_iot
      DB_USER: beehive_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - beehive-network
    volumes:
      - ./mqtt_handler:/app/mqtt_handler
      - ./meshbee_core:/app/meshbee_core

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: meshbee-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: beehive_iot
      DB_USER: beehive_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    networks:
      - beehive-network
    volumes:
      - ./api:/app/api
      # The static admin page served at /admin: edits show on the next request.
      - ./admin:/app/admin
      # Bind-mounted over the editable install, so library edits reload too.
      - ./meshbee_core:/app/meshbee_core
      # Only so the suite can exercise the MQTT entry point and the seed too.
      - ./mqtt_handler:/app/mqtt_handler
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini:ro
      - ./ruff.toml:/app/ruff.toml:ro
      # For the alembic CLI: `docker-compose exec api alembic revision --autogenerate ...`
      - ./alembic.ini:/app/alembic.ini:ro
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Caddy HTTPS Proxy
  # Terminates TLS in front of the API (uvicorn is HTTP-only), so the app is
  # reachable over HTTPS with a locally-trusted certificate.
  #   → https://localhost:8443/  (and /docs, /health)
  # Needs certs generated once with `make certs` (mkcert). If they're missing
  # the container prints instructions and exits cleanly: the rest of the stack
  # and plain HTTP on :8000 keep working.
  caddy:
    image: caddy:2-alpine
    container_name: meshbee-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Generated by `make certs` and gitignored (private keys).
      - ./caddy/certs:/certs:ro
    networks:
      - beehive-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /certs/localhost.pem ] || [ ! -f /certs/localhost-key.pem ]; then
          echo "─────────────────────────────────────────────────────────────"
          echo " No TLS certificate in caddy/certs/"
          echo " HTTPS is off; the API stays on http://localhost:8000/"
          echo " To enable HTTPS, run this once on the host, then 'up' again:"
          echo "   make certs"
          echo "─────────────────────────────────────────────────────────────"
          exit 0
        fi
        echo "─────────────────────────────────────────────────────────────"
        echo " Meshbee Backend"
        echo "   HTTPS  https://localhost:${HTTPS_PORT:-8443}/docs"
        echo "   HTTP   http://localhost:8000/docs"
        echo "─────────────────────────────────────────────────────────────"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

networks:
  beehive-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

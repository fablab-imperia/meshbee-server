# Weekly update PRs for every pinned dependency. Titles follow Conventional
# Commits so they pass pr-title.yml and land in the release-please changelog.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/api", "/mqtt_handler"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/api", "/mqtt_handler"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

# Weekly update PRs for every pinned dependency. Titles follow Conventional
# Commits so they pass pr-title.yml and land in the release-please changelog.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/api", "/mqtt_handler"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/api", "/mqtt_handler"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # Floating tags like python:3.14-slim are re-pushed with every Debian or
    # patch rebuild, so they always look days old and a cooldown skips them
    # forever ("Skipping tag ... due to cooldown period" in the job log).
    cooldown:
      exclude: ["python"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

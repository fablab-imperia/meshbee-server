# Weekly update PRs for every pinned dependency. Titles follow Conventional
# Commits so they pass pr-title.yml and land in the release-please changelog.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/api", "/mqtt_handler"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]

  # No `docker` entry: the Dockerfiles' base images (python:3.15-slim) are
  # watched by .github/workflows/base-images.yml, which opens an issue instead
  # of a PR. A new Python minor needs CI, requires-python and wheels for every
  # pin to move with it, which a one-Dockerfile PR can't do. The floating -slim
  # tag already picks up patch and Debian rebuilds on every image build.

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

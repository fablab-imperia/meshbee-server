# Tests and image builds on every pull request and every push to main.
# Runs with a read-only token: `pull_request` (never `pull_request_target`), so a
# PR from a fork gets no secrets and no write access. Actions are pinned to
# commit SHAs; Dependabot (.github/dependabot.yml) keeps the pins current.
# The SonarQube Cloud scan needs the SONAR_TOKEN secret, so it is skipped on fork
# PRs (config: sonar-project.properties).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The CI counterpart of the `postgres-test` compose service: throwaway, and
    # the fixtures rebuild it with `alembic upgrade head` on every run.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: beehive_test
          POSTGRES_USER: beehive_user
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beehive_user -d beehive_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # tests/conftest.py defaults to the compose hostname.
      TEST_DB_HOST: localhost
      # api/config.py builds Settings at import; these are the two fields with no
      # default. Dummy values — the tests never reach a real database or token.
      DB_PASSWORD: ci-not-a-secret
      JWT_SECRET_KEY: ci-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: SonarQube Cloud blames lines to find new code
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # same as the python:3.14-slim images
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            mqtt_handler/requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt -r api/requirements-dev.txt \
                      -r mqtt_handler/requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest --cov --cov-report=xml
      - name: SonarQube Cloud scan
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Only ruff, at the pin the dev container uses, so the two never disagree.
      - name: Install ruff
        run: pip install "$(grep '^ruff==' api/requirements-dev.txt)"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, mqtt_handler]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Built from the repo root, as docker-compose.yml does: both need meshbee_core.
      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.service }}/Dockerfile .

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The production layer only merges if every !reset/!override still matches
      # the base file. Dummy values: config interpolates, it never connects.
      - name: Check the production compose layer
        env:
          MESHBEE_DOMAIN: ci.example.org
          ACME_EMAIL: ci@example.org
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

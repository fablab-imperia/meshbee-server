# Opens and maintains a release PR from the Conventional Commits on main; merging
# that PR tags the release and publishes it on GitHub. See "Versioning and
# contributing" in README.md.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: this job holds contents/pull-requests write, so a moved
      # tag must not change what runs. Bump the SHA and the comment together.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# Alembic CLI config, for authoring migrations:
#   docker-compose exec api alembic revision --autogenerate -m "add x to letture"
#   docker-compose exec api alembic current
# No sqlalchemy.url here on purpose: meshbee_core/migrations/env.py builds it
# from the same DB_* variables every service already has. Applying migrations
# at startup goes through `python -m scripts.migrate`, which needs no ini.

[alembic]
script_location = meshbee_core/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

# New revisions come out linted and formatted. Runs where `alembic revision` runs:
# the api container, which has ruff from api/requirements-dev.txt. `op` and `sa`
# survive the fix even while unused: a hand-written revision is about to use them.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --unfixable F401 --exit-zero --silent REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

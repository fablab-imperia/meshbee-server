# Alembic CLI config, for authoring migrations:
#   docker-compose exec api alembic revision --autogenerate -m "add x to letture"
#   docker-compose exec api alembic current
# No sqlalchemy.url here on purpose: meshbee_core/migrations/env.py builds it
# from the same DB_* variables every service already has. Applying migrations
# at startup goes through `python -m scripts.migrate`, which needs no ini.

[alembic]
script_location = meshbee_core/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

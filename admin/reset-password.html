<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Meshbee: reimposta la password</title>
    <!-- Served at /reset-password, so every path is absolute. -->
    <link rel="stylesheet" href="/admin/vendor/pico-2.0.6.min.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script defer src="/admin/reset-password.js"></script>
  </head>
  <body>
    <main class="container login">
      <article>
        <header><strong>Meshbee: reimposta la password</strong></header>

        <!-- Without a token: ask for a link by email. -->
        <form id="forgot" hidden>
          <p>Inserisci l'email del tuo account: ti invieremo un link per sceglierne una nuova.</p>
          <label>
            Email
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <button type="submit">Invia il link</button>
        </form>

        <!-- With the token from the email: choose the new password. -->
        <form id="reset" hidden>
          <label>
            Nuova password
            <input type="password" name="password" autocomplete="new-password" minlength="8" required />
          </label>
          <label>
            Ripeti la nuova password
            <input type="password" name="confirm" autocomplete="new-password" minlength="8" required />
          </label>
          <button type="submit">Salva la password</button>
        </form>

        <p id="error" class="error" role="alert"></p>
        <p><output id="notice" class="notice"></output></p>
        <p id="again" hidden><a href="/reset-password">Richiedi un nuovo link</a></p>
      </article>
    </main>
  </body>
</html>

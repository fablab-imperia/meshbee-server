# SonarQube Cloud analysis, run by the `test` job in .github/workflows/ci.yml.
# Automatic Analysis must stay off in the SonarQube Cloud project settings:
# it would clash with this CI scan and cannot import coverage.
sonar.organization=fablab-imperia
sonar.projectKey=fablab-imperia_meshbee-server

sonar.sources=api,mqtt_handler,meshbee_core,scripts,admin
sonar.tests=tests
# Alembic revisions are declarative and repetitive by nature.
sonar.exclusions=meshbee_core/migrations/**
# The admin page is analysed for quality, but no test runs its JS.
sonar.coverage.exclusions=admin/**

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

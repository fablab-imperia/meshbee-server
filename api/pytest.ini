[pytest]
testpaths = tests
# The api/ modules are flat (`from config import settings`), not a package:
# put the rootdir (/app in the container) on sys.path so tests can import them.
pythonpath = .
addopts = -ra --strict-markers
markers =
    integration: needs the postgres-test database (docker-compose --profile test up -d postgres-test).
        Skip with: pytest -m "not integration"

# Lint and format config, shared by the dev container and CI.
# A file of its own rather than a [tool.ruff] table: pyproject.toml is baked into
# the image, while this one is bind-mounted, so an edit applies without a rebuild.
#   docker-compose exec api ruff check .
#   docker-compose exec api ruff format .
line-length = 88
target-version = "py311" # same as the python:3.11-slim images

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The formatter owns line length; what it can't wrap (long strings, comments) stays.
ignore = ["E501"]

[lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as call defaults by design.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[lint.isort]
known-first-party = ["api", "meshbee_core", "mqtt_handler", "scripts", "tests"]
